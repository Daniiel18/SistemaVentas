name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SolucionSistemaVentas.sln

      - name: Build
        run: dotnet build SolucionSistemaVentas.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish SistemaVenta.AplicacionWeb/SistemaVenta.AplicacionWeb.csproj --configuration Release --no-build --output ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: sistemaventas-web
          path: ./publish
